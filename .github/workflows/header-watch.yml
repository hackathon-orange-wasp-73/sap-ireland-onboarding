name: Header watch

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: "0 6 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: "URL to watch (defaults to the onboarding site's GitHub Pages URL)"
        required: false
        default: ""
      model:
        description: "Copilot model to use"
        required: false
        default: "claude-haiku-4.5"

# Design choice: on push/pull_request we run immediately against the current live
# Pages URL rather than polling for the new Pages deployment to finish. GitHub Pages
# builds are typically done within well under a minute, so a push-triggered run here
# mostly still observes the deployment that resulted from this same push; any residual
# race is caught by the next scheduled/manual run. This avoids added complexity (e.g.
# polling the Pages deployments API) for a low-stakes header/nav check.
jobs:
  header-watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/header-watch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No package-lock.json is committed (see README), so install rather than `npm ci`.
      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright's Chromium browser
        run: npm run browser:install

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Pre-stage the Copilot SDK runtime
        run: python -m copilot download-runtime

      # Persist header-watch's run history (latest.json + before/after screenshots)
      # across CI runs so each run compares against the previous one's screenshot,
      # same as local runs do. Key is per-run-id so the cache is always re-saved
      # (actions/cache skips saving on an exact key hit); restore-keys falls back to
      # the most recent cache with this prefix, i.e. the previous run's state.
      - name: Restore/persist header-watch run history
        uses: actions/cache@v4
        with:
          path: tools/header-watch/.header-watch
          key: header-watch-state-${{ github.run_id }}
          restore-keys: |
            header-watch-state-

      - name: Run header watch
        id: watch
        env:
          COPILOT_SDK_TOKEN: ${{ secrets.COPILOT_SDK_TOKEN }}
        run: |
          set -o pipefail
          URL="${{ github.event.inputs.url }}"
          MODEL="${{ github.event.inputs.model }}"
          ARGS=()
          if [ -n "$URL" ]; then ARGS+=("$URL"); fi
          if [ -n "$MODEL" ]; then ARGS+=(--model "$MODEL"); fi
          python header_watch.py "${ARGS[@]}" --output .header-watch --timeout 300 | tee run.log
          ARTIFACT_DIR=$(grep '^Artifacts:' run.log | sed 's/^Artifacts: //')
          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"
          STATUS=$(python -c "import json; print(json.load(open('$ARTIFACT_DIR/outcome.json'))['status'])")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload run artifacts
        if: always() && steps.watch.outputs.artifact_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: header-watch-run-${{ github.run_id }}
          # artifact_dir is already an absolute path printed by header_watch.py.
          path: ${{ steps.watch.outputs.artifact_dir }}
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if the header changed
        if: steps.watch.outputs.status == 'changed'
        run: |
          echo "::error::Header/nav changed since the previous run. See the uploaded report.md artifact."
          exit 1
